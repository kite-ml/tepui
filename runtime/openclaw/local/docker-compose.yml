# Local OpenClaw for Phase 0 validation.
#
# Runs both kill-tests on a laptop before any VPS is paid for. If either test
# fails, the architecture changes and we have spent nothing.
#
# The image is pinned BY DIGEST, not by :latest — upstream moves fast enough
# that a floating tag would make these results irreproducible.
services:
  gateway:
    image: ghcr.io/openclaw/openclaw@sha256:2f5ce8848a1a69b3c460622e566cb9395da9fd18d7ef7b038cd8e2c4f195decf
    container_name: tepui-gateway
    restart: unless-stopped
    # Loopback ONLY. Never expose the gateway on 0.0.0.0 — with no valid auth
    # path configured it refuses connections, but do not rely on that.
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./state:/home/node/.openclaw
      # SPLIT MOUNT — this is the enforcement mechanism, and it is load-bearing.
      #
      # Phase 0 finding (2026-08-21): OpenClaw's "$include fails closed for its
      # own writes" does NOT hold for `config set`. With a writable mount the
      # runtime rewrote generated/agents.json5, flipping intake.sandbox.mode
      # from "all" to "off" — disabling the sandbox on the quarantine agent —
      # and applied it live without a restart.
      #
      # So git-as-truth is enforced by FILESYSTEM PERMISSIONS, not by the app's
      # good behaviour. Config the runtime must never mutate is mounted :ro;
      # only the agent workspaces and loop memory are writable.
      - ../../../../tepui-company/generated:/home/node/.openclaw/repos/tepui-company/generated:ro
      - ../../../../tepui-core:/home/node/.openclaw/repos/tepui-core:ro
      - ../../../../tepui-company/agents:/home/node/.openclaw/repos/tepui-company/agents
      - ../../../../tepui-company/loops:/home/node/.openclaw/repos/tepui-company/loops
      - ../../../../tepui-company/decisions:/home/node/.openclaw/repos/tepui-company/decisions
    environment:
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw/openclaw.json
      # No credentials here. Real secrets come from .env, which is gitignored.
    env_file:
      - path: ./.env
        required: false
    # 2 GB minimum — the build OOMs at 1 GB (exit 137).
    deploy:
      resources:
        limits: { memory: 3G }
    security_opt:
      - no-new-privileges:true
