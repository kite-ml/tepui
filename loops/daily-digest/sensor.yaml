loop: daily-digest
sensors:
  - name: morning
    kind: schedule
    cron: "30 7 * * *"
    tz: Europe/London
    # isolated: a direct instruction the agent must act on. A main-session
    # system event gets treated as heartbeat traffic and answered with "all
    # systems normal" instead of running the loop — observed live.
    session: isolated
    payload:
      message: Use the daily-digest skill now, and post the digest to your Slack channel.
