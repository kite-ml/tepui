loop: daily-digest
sensors:
  - name: morning
    kind: schedule
    cron: "30 7 * * *"
    tz: Europe/London
    # isolated: a direct instruction the agent must act on. A main-session
    # system event gets treated as heartbeat traffic and answered with "all
    # systems normal" instead of running the loop — observed live.
    session: isolated
    # The scheduler delivers the run's final text to the owner's Slack channel.
    # A cron session has no Slack tools of its own — announce IS the posting
    # mechanism, so the skill just replies with the digest.
    announce: true
    payload:
      message: Use the daily-digest skill now. Your final reply IS the digest that gets posted.
